services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dspro-backend
    expose:
      - "8000"
    environment:
      - RECOMMENDER_STRATEGY=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
      - UV_NO_CACHE=1
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data:/app/data
      - ./embedding:/app/embedding
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
    container_name: dspro-frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
